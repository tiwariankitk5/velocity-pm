version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/velocity_pm
      JWT_ACCESS_SECRET: replace-with-long-random-access-secret
      JWT_REFRESH_SECRET: replace-with-long-random-refresh-secret
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  mongo-data:
